<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulación de Phishing</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#0DA9FF,#00A443);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

.container{
    width:90%;
    max-width:1200px;
}

.phishing-image{
    width:250px;
    height:auto;
    margin-bottom:30px;

    animation:pulse 2s infinite;
}

h1{
    font-size:72px;
    font-weight:900;
    margin-bottom:40px;
    text-shadow:3px 3px 12px rgba(0,0,0,0.3);
}

.message{
    font-size:34px;
    line-height:1.5;
    margin-bottom:40px;
}

.variable{
    font-size:60px;
    font-weight:bold;
    color:#FFD700;
    margin-top:20px;
    text-shadow:3px 3px 10px rgba(0,0,0,0.3);
}

.footer{
    margin-top:50px;
    font-size:24px;
    opacity:0.95;
}

@keyframes pulse {

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.10);
    }

    100%{
        transform:scale(1);
    }

}

</style>

</head>

<body>

<div class="container">

    <img
        class="phishing-image"
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        alt="Phishing">

    <h1>🚨 ¡HAS CAÍDO EN EL PHISHING! 🚨</h1>

    <div class="message">
        Hemos obtenido tu usuario y contraseña ar su procedencia.
    </div>

    <div class="variable">
        💸 TE QUEDAS SIN EL VARIABLE 💸
    </div>

    <div class="footer">
        Por suerte esta era únicamente una simulación de concienciación en ciberseguridad.
    </div>

</div>

</body>

</html>
