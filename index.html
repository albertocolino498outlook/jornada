<!DOCTYPE html>
<html lang="es">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>¡PICADO!</title>
 
<style>
 
*{
margin:0;
padding:0;
box-sizing:border-box;
}
 
body{
font-family: Arial, Helvetica, sans-serif;
background: linear-gradient(135deg,#0DA9FF,#00A443);
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}
 
.container{
width:90%;
max-width:700px;
}
 
.icon{
font-size:100px;
margin-bottom:10px;
}
 
h1{
font-size:64px;
font-weight:900;
margin-bottom:15px;
text-shadow:0 4px 16px rgba(0,0,0,0.3);
}
 
.message{
font-size:22px;
line-height:1.3;
margin-bottom:25px;
}
 
.variable{
font-size:42px;
font-weight:900;
color:#FFD700;
margin-bottom:20px;
text-shadow:0 4px 16px rgba(0,0,0,0.3);
}
 
.footer{
font-size:16px;
opacity:0.9;
}
 
</style>
 
</head>
 
<body>
 
<div class="container">
 
<div class="icon">🚨</div>
 
<h1>¡HAS CAIDO!</h1>
 
<div class="message">
Has escaneado un QR sin comprobar su procedencia.
<br><br>
Por suerte esta vez era una simulación.
</div>
 
<div class="variable">
💸 TE QUEDAS SIN EL VARIABLE 💸
</div>
 
<div class="footer">
La próxima vez verifica la URL antes de escanear.
</div>
 
</div>
 
</body>
 
</html>
